                  name: config-volume
                  readOnly: true
                - mountPath: /etc/metrics-certs
                  name: metrics-certs
                  readOnly: true
              serviceAccountName: agent-sandbox-controller
              volumes:
              - configMap:
                  name: agent-sandbox-config
                  optional: true
                name: config-volume
              - name: metrics-certs
                secret:
                  secretName: agent-sandbox-metrics-tls
      - label:
