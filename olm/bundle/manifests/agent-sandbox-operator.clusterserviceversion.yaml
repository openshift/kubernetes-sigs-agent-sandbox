              app.kubernetes.io/name: sandbox-router
          strategy: {}
          template:
            metadata:
              annotations:
                prometheus.io/path: /metrics
                prometheus.io/port: "9090"
                prometheus.io/scrape: "true"
              labels:
                app: sandbox-router
                app.kubernetes.io/component: sandbox-router
                app.kubernetes.io/name: sandbox-router
            spec:
              automountServiceAccountToken: false
              containers:
              - args:
                - --http-bind-address=
                - --https-bind-address=:8443
                - --tls-cert-file=/etc/tls/tls.crt
                - --tls-key-file=/etc/tls/tls.key
                - --metrics-secure-serving
                - --metrics-bind-address=:9090
                - --health-probe-bind-address=:8081
                - --cluster-domain=cluster.local
                - --proxy-timeout=180s
                - --upstream-max-retries=3
                - --cache-enabled=true
                image: registry.redhat.io/agent-sandbox/agent-sandbox-router@sha256:e19a6f5646593b4d746e91a68be1ffee943114aa4b1f3d7108c4cc13e45cdcd9
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: healthz
                  initialDelaySeconds: 5
                  periodSeconds: 10
                name: sandbox-router
                ports:
                - containerPort: 8443
                  name: proxy-tls
                  protocol: TCP
                - containerPort: 9090
                  name: metrics
                  protocol: TCP
                - containerPort: 8081
                  name: healthz
                  protocol: TCP
                readinessProbe:
                  failureThreshold: 2
                  httpGet:
                    path: /readyz
                    port: healthz
                  initialDelaySeconds: 1
                  periodSeconds: 5
                resources:
                  limits:
                    cpu: "2"
                    memory: 1Gi
                  requests:
                    cpu: 250m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  name: kubernetes-api-access
                  readOnly: true
                - mountPath: /etc/tls
                  name: tls-certs
                  readOnly: true
              serviceAccountName: sandbox-router
              terminationGracePeriodSeconds: 45
              topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sandbox-router
                maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sandbox-router
                maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
              volumes:
              - name: kubernetes-api-access
                projected:
                  defaultMode: 292
                  sources:
                  - serviceAccountToken:
                      expirationSeconds: 3600
                      path: token
                  - configMap:
                      items:
                      - key: ca.crt
                        path: ca.crt
                      name: kube-root-ca.crt
                  - downwardAPI:
                      items:
                      - fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace
                        path: namespace
              - name: tls-certs
                secret:
                  secretName: sandbox-router-tls
