            matchLabels:
              app: agent-sandbox-controller
          strategy: {}
          template:
            metadata:
              labels:
                app: agent-sandbox-controller
            spec:
              containers:
              - args:
                - --leader-elect=true
                - --extensions
                - --metrics-secure-serving
                - --metrics-bind-address=:8443
                - --metrics-cert-dir=/etc/metrics-certs
                image: registry.redhat.io/agent-sandbox/agent-sandbox-rhel9-operator@sha256:c08c0d4d9a094adf1d7681798fda3ef96bd37b230fc2aae47ea3a24d9b06102e
